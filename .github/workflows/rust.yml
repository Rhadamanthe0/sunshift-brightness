name: Rust Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        options: [all, linux, windows]
        default: all
      windows_runner:
        description: Windows runner
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

env:
  CARGO_TERM_COLOR: always

# L'étape « Publish Release Artifacts » (sur tag) crée une Release via le
# GITHUB_TOKEN. Par défaut le dépôt le fournit en lecture seule -> échec 403.
# On lui accorde l'écriture du contenu (suffisant : checkout + création de Release).
permissions:
  contents: write

# Un push annule le run precedent de la meme branche (pas de file inutile).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_runner == 'self-hosted' && fromJSON('["self-hosted", "windows", "x64"]') || 'windows-latest' }}
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test --locked

      - name: Cargo Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo Release Build
        run: cargo build --locked --release

      - name: Install NSIS
        if: runner.environment == 'github-hosted'
        run: choco install nsis -y --no-progress

      # makensis doit tourner depuis installer/ : le script utilise des chemins
      # relatifs (..\target\release, ..\assets) qui supposent ce dossier courant.
      # Il y produit aussi ssb-installer.exe, attendu par l'étape Publish.
      - name: Create installer
        working-directory: installer
        run: |
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($nsis) {
            & $nsis.Source windows.nsi
          } elseif (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") {
            & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" windows.nsi
          } else {
            throw "Install NSIS 3 on the Windows runner, then retry."
          }

      - if: startsWith(github.ref, 'refs/tags/')
        name: Publish Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./target/release/ssb.exe
            ./target/release/ssb-cli.exe
            ./installer/ssb-installer.exe

  ubuntu:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    # MINIPC-CLEM : libudev-dev, libssl-dev et la chaîne C sont dans l'image du
    # runner. apt-get y est impossible (root sans capacité : setgroups refusé).
    runs-on: [self-hosted, linux, x64, minipc, podman]

    steps:
      - name: Check Ubuntu dependencies
        run: dpkg -s libudev-dev libssl-dev build-essential pkg-config >/dev/null

      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Les runners auto-hébergés n'ont pas le profil rustup des runners
          # GitHub : clippy doit être demandé explicitement.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test --locked

      - name: Cargo Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check Linux installer syntax
        run: bash -n linux/ubuntu_install.sh

  check_style:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: [self-hosted, linux, x64, minipc, podman]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cargo Format
        run: cargo fmt -- --check

      - name: Cargo Sort
        run: cargo install cargo-sort --debug && cargo-sort --check --workspace
