name: Rust Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        options: [all, linux, windows]
        default: all
      windows_runner:
        description: Windows runner
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

env:
  CARGO_TERM_COLOR: always

# L'étape « Publish Release Artifacts » (sur tag) crée une Release via le
# GITHUB_TOKEN. Par défaut le dépôt le fournit en lecture seule -> échec 403.
# On lui accorde l'écriture du contenu (suffisant : checkout + création de Release).
permissions:
  contents: write

# Un push annule le run precedent de la meme branche (pas de file inutile).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: ${{ inputs.windows_runner == 'github-hosted' && 'windows-latest' || fromJSON('["self-hosted", "windows", "x64"]') }}
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Windows build tools
        run: |
          $rustInfo = rustc -vV
          if ($LASTEXITCODE -ne 0) { throw "Rust is not available to the runner account." }
          $rustInfo
          if ($rustInfo -match 'host: x86_64-pc-windows-gnu') {
            if (-not (Get-Command dlltool.exe -ErrorAction SilentlyContinue)) {
              foreach ($directory in @('C:\Strawberry\c\bin', 'C:\msys64\mingw64\bin')) {
                if (Test-Path "$directory\dlltool.exe") {
                  $env:PATH = "$directory;$env:PATH"
                  $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  break
                }
              }
            }
            if (-not (Get-Command gcc.exe -ErrorAction SilentlyContinue) -or
                -not (Get-Command dlltool.exe -ErrorAction SilentlyContinue)) {
              $toolDirectory = Join-Path $env:RUNNER_TEMP 'ssb-mingw'
              $archive = Join-Path $env:RUNNER_TEMP 'ssb-mingw.zip'
              $uri = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip'
              Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
              if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd5dbafc4a170e762ca6143151ec918fb9e2c72736fb14cd704abebc6bdd5276a') {
                throw 'MinGW archive checksum mismatch.'
              }
              Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
              $directory = Join-Path $toolDirectory 'mingw64\bin'
              $env:PATH = "$directory;$env:PATH"
              $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            foreach ($tool in @('gcc.exe', 'dlltool.exe', 'windres.exe')) {
              if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
                throw "GNU Rust needs MinGW on PATH (missing $tool). See installer/SELF_HOSTED_CI.md."
              }
            }
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test --locked

      - name: Cargo Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo Release Build
        run: cargo build --locked --release

      - name: Install NSIS
        if: runner.environment == 'github-hosted'
        run: choco install nsis -y --no-progress

      # makensis doit tourner depuis installer/ : le script utilise des chemins
      # relatifs (..\target\release, ..\assets) qui supposent ce dossier courant.
      # Il y produit aussi ssb-installer.exe, attendu par l'étape Publish.
      - name: Create installer
        working-directory: installer
        run: |
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($nsis) {
            & $nsis.Source windows.nsi
          } elseif (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") {
            & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" windows.nsi
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'ssb-nsis.zip'
            $directory = Join-Path $env:RUNNER_TEMP 'ssb-nsis'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') {
              throw 'NSIS archive checksum mismatch.'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $directory
            & "$directory\nsis-3.11\makensis.exe" windows.nsi
          }

      - if: startsWith(github.ref, 'refs/tags/')
        name: Publish Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./target/release/ssb.exe
            ./target/release/ssb-cli.exe
            ./installer/ssb-installer.exe

  ubuntu:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    # MINIPC-CLEM : libudev-dev, libssl-dev et la chaîne C sont dans l'image du
    # runner. apt-get y est impossible (root sans capacité : setgroups refusé).
    runs-on: [self-hosted, linux, x64, minipc, podman]

    steps:
      - name: Check Ubuntu dependencies
        run: dpkg -s libudev-dev libssl-dev build-essential pkg-config >/dev/null

      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Les runners auto-hébergés n'ont pas le profil rustup des runners
          # GitHub : clippy doit être demandé explicitement.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test --locked

      - name: Cargo Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check Linux installer syntax
        run: bash -n linux/ubuntu_install.sh

  check_style:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: [self-hosted, linux, x64, minipc, podman]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cargo Format
        run: cargo fmt -- --check

      - name: Cargo Sort
        run: cargo install cargo-sort --debug && cargo-sort --check --workspace
