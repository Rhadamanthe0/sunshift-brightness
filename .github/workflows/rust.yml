name: Rust Build

# Une seule CI par PR ; les tags de version conservent leur publication.
on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        options: [all, linux, windows]
        default: all
      physical_monitor_check:
        description: Check native monitor brightness by writing and reading back its current values
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Les constructions et tests restent en lecture seule. Seul le job de
# publication des artefacts validés sur tag peut créer une release.
permissions:
  contents: read

# Une PR remplace sa validation précédente ; les runs manuels et du tronc restent indépendants.
concurrency:
  group: rust-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    # Toutes les exécutions, forks compris, exigent une VM Windows neuve
    # par job sur MINIPC-CLEM ; les labels seuls ne prouvent pas son isolation.
    runs-on: [self-hosted, windows, x64, minipc, ephemeral, sunshift, "rhada-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell

    steps:
      - name: Prepare Windows target directory
        run: |
          $target = Join-Path $env:RUNNER_TOOL_CACHE 'ssb-cargo-target'
          $previous = Join-Path $env:GITHUB_WORKSPACE 'target'
          if (-not (Test-Path $target) -and (Test-Path $previous)) {
            Move-Item -LiteralPath $previous -Destination $target
          }
          "CARGO_TARGET_DIR=$($target.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # rust-cache attend un chemin relatif au workspace, même hors du checkout.
          $workspaceUri = [Uri]($env:GITHUB_WORKSPACE.TrimEnd('\', '/') + '/')
          $targetUri = [Uri]($target.TrimEnd('\', '/') + '/')
          $relativeTarget = [Uri]::UnescapeDataString($workspaceUri.MakeRelativeUri($targetUri).ToString())
          "CARGO_CACHE_TARGET=$relativeTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare isolated Rust toolchain
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # Préférence à la toolchain scellée de la VM jetable (rhada-pc).
          $baseRust = 'C:\RhadaCI\tools\rust'
          $directory = if (Test-Path -LiteralPath (Join-Path $baseRust 'cargo\bin\rustup.exe')) {
            $baseRust
          } else {
            Join-Path $env:RUNNER_TOOL_CACHE 'ssb-rust'
          }
          $env:CARGO_HOME = Join-Path $directory 'cargo'
          $env:RUSTUP_HOME = Join-Path $directory 'rustup'
          $env:RUSTUP_TOOLCHAIN = 'stable-x86_64-pc-windows-gnu'
          $rustup = Join-Path $env:CARGO_HOME 'bin\rustup.exe'
          if (-not (Test-Path $rustup)) {
            $temporary = Join-Path $env:RUNNER_TEMP 'ssb-rustup'
            New-Item -ItemType Directory -Path $temporary -Force | Out-Null
            # Rustup selects installer/proxy mode from its executable name.
            $installer = Join-Path $temporary 'rustup-init.exe'
            $uri = 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe'
            Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $installer -TimeoutSec 300
            Invoke-WebRequest -UseBasicParsing -Uri "$uri.sha256" -OutFile "$installer.sha256" -TimeoutSec 60
            $checksum = [IO.File]::ReadAllText("$installer.sha256").Trim().Split(' ')[0]
            if ($checksum -notmatch '^[a-fA-F0-9]{64}$' -or
                (Get-FileHash $installer -Algorithm SHA256).Hash -ne $checksum) {
              throw 'Rustup archive checksum mismatch.'
            }
            $env:RUSTUP_INIT_SKIP_PATH_CHECK = 'yes'
            & $installer -y --no-modify-path --profile minimal --default-toolchain $env:RUSTUP_TOOLCHAIN
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install isolated Rust toolchain.' }
          }
          if ($directory -eq $baseRust) {
            & $rustup run $env:RUSTUP_TOOLCHAIN rustc -vV
            if ($LASTEXITCODE -ne 0) { throw 'Sealed GNU Rust toolchain failed its runtime check.' }
            & $rustup run $env:RUSTUP_TOOLCHAIN cargo clippy --version
            if ($LASTEXITCODE -ne 0) { throw 'Sealed Clippy unavailable.' }
          } else {
            & $rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy --no-self-update
            if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare Rust and Clippy.' }
          }
          foreach ($name in @('CARGO_HOME', 'RUSTUP_HOME', 'RUSTUP_TOOLCHAIN')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          (Join-Path $env:CARGO_HOME 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Windows build tools
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # WinLibs 16.2.0 intégré à la référence ; garder le chemin de
          # téléchargement vérifié pour les références précédentes.
          $baseMinGW = 'C:\RhadaCI\tools\mingw\mingw64\bin'
          if (Test-Path -LiteralPath (Join-Path $baseMinGW 'dlltool.exe')) {
            $env:PATH = "$baseMinGW;$env:PATH"
            $baseMinGW | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $rustInfo = rustc -vV
          if ($LASTEXITCODE -ne 0) { throw "Rust is not available to the runner account." }
          $rustInfo
          if ($rustInfo -match 'host: x86_64-pc-windows-gnu') {
            if (-not (Get-Command dlltool.exe -ErrorAction SilentlyContinue)) {
              foreach ($directory in @('C:\Strawberry\c\bin', 'C:\msys64\mingw64\bin')) {
                if (Test-Path "$directory\dlltool.exe") {
                  $env:PATH = "$directory;$env:PATH"
                  $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  break
                }
              }
            }
            if (-not (Get-Command gcc.exe -ErrorAction SilentlyContinue) -or
                -not (Get-Command dlltool.exe -ErrorAction SilentlyContinue)) {
              $toolDirectory = Join-Path $env:RUNNER_TOOL_CACHE 'ssb-mingw-16.2.0posix-14.0.0-ucrt-r2'
              $archive = Join-Path $env:RUNNER_TEMP 'ssb-mingw.zip'
              $ready = Join-Path $toolDirectory '.ready'
              if (-not (Test-Path $ready)) {
                $uri = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip'
                Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 300
                if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd5dbafc4a170e762ca6143151ec918fb9e2c72736fb14cd704abebc6bdd5276a') {
                  throw 'MinGW archive checksum mismatch.'
                }
                if (Test-Path "$env:SystemRoot\System32\tar.exe") {
                  New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
                  & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $toolDirectory
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to extract MinGW.' }
                } else {
                  Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory -Force
                }
                New-Item -ItemType File -Path $ready | Out-Null
              }
              $directory = Join-Path $toolDirectory 'mingw64\bin'
              $env:PATH = "$directory;$env:PATH"
              $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            foreach ($tool in @('gcc.exe', 'dlltool.exe', 'windres.exe')) {
              if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
                throw "GNU Rust needs MinGW on PATH (missing $tool). See installer/SELF_HOSTED_CI.md."
              }
            }
          }

      - name: Test optional compressor fallback (offline)
        run: '& ./installer/test_zstd_fallback.ps1'

      # La VM jetable disposait de GNU tar mais retombait sur gzip ; 1 Gio
      # de cache Rust a nécessité 17 min d'extraction. Zstd est optionnel.
      - name: Enable fast Windows Cargo cache compression
        run: |
          $available = Get-Command zstd.exe -ErrorAction SilentlyContinue
          if ($available) {
            & $available.Source --version
            if ($LASTEXITCODE -ne 0) { throw 'Existing zstd.exe failed its version check' }
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'ssb-zstd-1.5.7.zip'
            $directory = Join-Path $env:RUNNER_TEMP 'ssb-zstd-1.5.7'
            try {
              $uri = 'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip'
              Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 120
              $expected = 'a96dc5417943c03fa231bf2d6a586b7ae7254fa52fdc15d302f296b5ff88e1ff0f07120a720149eb82ea0f0c65444393ebf05d2ee1bd1db341b803ff65a2e675'
              if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) {
                throw 'Zstandard SHA-512 mismatch: executable refused'
              }
              Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
              # L'archive officielle peut contenir une seconde archive ZIP.
              $nested = @(Get-ChildItem -LiteralPath $directory -File -Recurse -Filter '*.zip')
              if ($nested.Count -gt 1) { throw 'Unexpected multiple nested Zstandard archives' }
              if ($nested.Count -eq 1) {
                Expand-Archive -LiteralPath $nested[0].FullName -DestinationPath (Join-Path $directory 'inner') -Force
              }
              $binaries = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter 'zstd.exe')
              if ($binaries.Count -ne 1) { throw "Expected one zstd.exe, found $($binaries.Count)" }
              & $binaries[0].FullName --version
              if ($LASTEXITCODE -ne 0) { throw 'Verified zstd.exe failed to start' }
              $binaryDir = Split-Path -Parent $binaries[0].FullName
              [IO.File]::AppendAllText($env:GITHUB_PATH, $binaryDir + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
              Write-Output '[ci] Verified Zstandard enabled for Cargo cache'
            } catch {
              # Une panne du téléchargement n'empêche pas les tests : repli gzip.
              # Jamais d'exécution du binaire si l'empreinte est incorrecte.
              # Le runner termine sur LASTEXITCODE, même après une exception traitée.
              # Seul cet outil optionnel peut échouer sans bloquer les tests.
              $global:LASTEXITCODE = 0
              Write-Warning "[ci] Zstandard unavailable; keep gzip: $($_.Exception.Message)"
            }
          }

      # Un cache exact est immuable : renouveler une fois par semaine pour
      # conserver les nouveaux objets compilés après la restauration précédente.
      - name: Select weekly Rust cache generation
        run: |
          $today = [DateTime]::UtcNow.Date
          $monday = $today.AddDays(-(([int]$today.DayOfWeek + 6) % 7))
          "RUST_CACHE_WEEK=$($monday.ToString('yyyyMMdd'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Windows Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Rust et MinGW sont préparés avant le calcul de la clé.
          key: windows-gnu-mingw-16.2.0posix-14.0.0-ucrt-r2-${{ env.RUST_CACHE_WEEK }}
          workspaces: ". -> ${{ env.CARGO_CACHE_TARGET }}"
          cache-bin: false
          # Un échec doit terminer et publier ses diagnostics sans recompresser
          # plusieurs Gio ; l'annulation du post-cache peut perdre les logs.
          cache-on-failure: false

      - name: Cargo Test
        run: cargo test --locked

      - name: Cargo Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo Release Build
        run: cargo build --locked --release

      # makensis doit tourner depuis installer/ : le script utilise des chemins
      # relatifs (..\target\release, ..\assets) qui supposent ce dossier courant.
      # Il y produit aussi ssb-installer.exe, attendu par l'étape Publish.
      - name: Create installer
        working-directory: installer
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $binaries = Join-Path $env:CARGO_TARGET_DIR 'release'
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($nsis) {
            & $nsis.Source "/DBINDIR=$binaries" windows.nsi
          } elseif (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") {
            & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DBINDIR=$binaries" windows.nsi
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'ssb-nsis.zip'
            $directory = Join-Path $env:RUNNER_TOOL_CACHE 'ssb-nsis-3.11'
            $ready = Join-Path $directory '.ready'
            if (-not (Test-Path $ready)) {
              # Le téléchargement SourceForge peut renvoyer un fichier différent.
              # Le miroir contient les mêmes octets : l'empreinte reste obligatoire.
              $verified = $false
              foreach ($uri in @(
                'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip',
                'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'
              )) {
                try {
                  Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 300 -ErrorAction Stop
                  $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
                  if ($checksum -eq 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') {
                    $verified = $true
                    break
                  }
                  Write-Warning "NSIS archive checksum mismatch: $checksum"
                } catch {
                  Write-Warning "Unable to download NSIS: $($_.Exception.Message)"
                }
              }
              if (-not $verified) { throw 'Unable to download the verified NSIS archive.' }
              if (Test-Path "$env:SystemRoot\System32\tar.exe") {
                New-Item -ItemType Directory -Path $directory -Force | Out-Null
                & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $directory
                if ($LASTEXITCODE -ne 0) { throw 'Unable to extract NSIS.' }
              } else {
                Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
              }
              New-Item -ItemType File -Path $ready | Out-Null
            }
            & "$directory\nsis-3.11\makensis.exe" "/DBINDIR=$binaries" windows.nsi
          }

      - name: Windows installer lifecycle
        run: '& ./installer/test_windows_installer.ps1'

      # Compilation and Cargo metadata scanning must not consume the GUI's
      # execution deadline, including in the ephemeral Windows VM.
      - name: Prepare Windows GUI test executable
        timeout-minutes: 10
        run: '& ./installer/test_windows_gui.ps1 -PrepareOnly'

      - name: Windows GUI lifecycle Vulkan
        timeout-minutes: 3
        env:
          SSB_TEST_MONITOR_ROUNDTRIP: ${{ inputs.physical_monitor_check && '1' || '0' }}
        run: '& ./installer/test_windows_gui.ps1 -Backend Vulkan'

      - name: Windows GUI lifecycle OpenGL
        timeout-minutes: 3
        env:
          SSB_TEST_MONITOR_ROUNDTRIP: '0'
        run: '& ./installer/test_windows_gui.ps1 -Backend OpenGL'

      - if: startsWith(github.ref, 'refs/tags/')
        name: Collect Release Artifacts
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'sunshift-release-artifacts'
          New-Item -ItemType Directory -Path $directory | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release\ssb.exe') -Destination $directory
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release\ssb-cli.exe') -Destination $directory
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'installer\ssb-installer.exe') -Destination $directory

      - if: startsWith(github.ref, 'refs/tags/')
        name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/sunshift-release-artifacts/*.exe
          if-no-files-found: error

  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, minipc, ephemeral, podman-jit-v2, "rhada-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts

      - name: Publish Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ssb.exe
            release-artifacts/ssb-cli.exe
            release-artifacts/ssb-installer.exe

  ubuntu:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    # MINIPC-CLEM : libudev-dev, libssl-dev et la chaîne C sont dans l'image du
    # runner. apt-get y est impossible (root sans capacité : setgroups refusé).
    runs-on: [self-hosted, linux, x64, minipc, ephemeral, podman-jit-v2, "rhada-run-${{ github.run_id }}-${{ github.run_attempt }}"]

    steps:
      - name: Check Ubuntu dependencies
        run: dpkg -s libudev-dev libssl-dev build-essential pkg-config >/dev/null

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Les runners auto-hébergés n'ont pas le profil rustup des runners
          # GitHub : clippy doit être demandé explicitement.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test --locked

      - name: Cargo Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check Linux installer syntax
        run: bash -n linux/ubuntu_install.sh

  check_style:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: [self-hosted, linux, x64, minipc, ephemeral, podman-jit-v2, "rhada-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Diagnose dependency lock (temporary)
        shell: bash
        run: |
          # Resolve the full dependency graph, including target-specific crates.
          # --no-deps would not sufficiently exercise the broken lockfile.
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo 'Cargo.lock differs from the Cargo resolver result:'
            cargo metadata --format-version 1 >/dev/null
            git diff -- Cargo.lock
            exit 1
          fi
      - name: Cargo Format
        run: cargo fmt -- --check

      - name: Cargo Sort
        run: cargo install cargo-sort --debug && cargo-sort --check --workspace
