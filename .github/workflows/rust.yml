name: Rust Build

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

# L'étape « Publish Release Artifacts » (sur tag) crée une Release via le
# GITHUB_TOKEN. Par défaut le dépôt le fournit en lecture seule -> échec 403.
# On lui accorde l'écriture du contenu (suffisant : checkout + création de Release).
permissions:
  contents: write

# Un push annule le run precedent de la meme branche (pas de file inutile).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    # PC-PRO-CLEM : runner Windows auto-hébergé du dépôt (label sunshift).
    # Le PC fixe n'a pas encore son runner : en attendant, PC-PRO prend tout
    # (le premier allumé prend le job une fois les deux en ligne).
    runs-on: [self-hosted, windows, x64, sunshift]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Les runners auto-hébergés n'ont pas le profil rustup des runners
          # GitHub : clippy doit être demandé explicitement.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test

      - name: Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Cargo Release Build
        run: cargo build --release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # makensis doit tourner depuis installer/ : le script utilise des chemins
      # relatifs (..\target\release, ..\assets) qui supposent ce dossier courant.
      # Il y produit aussi ssb-installer.exe, attendu par l'étape Publish.
      - name: Create installer
        working-directory: installer
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" windows.nsi'

      - if: startsWith(github.ref, 'refs/tags/')
        name: Publish Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./target/release/ssb.exe
            ./target/release/ssb-cli.exe
            ./installer/ssb-installer.exe

  ubuntu:
    # MINIPC-CLEM : libudev-dev, libxdo-dev et la chaîne C sont dans l'image du
    # runner. apt-get y est impossible (root sans capacité : setgroups refusé).
    runs-on: [self-hosted, linux, x64, minipc, podman]

    steps:
      - name: Check Ubuntu dependencies
        run: dpkg -s libudev-dev libxdo-dev build-essential pkg-config >/dev/null

      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Les runners auto-hébergés n'ont pas le profil rustup des runners
          # GitHub : clippy doit être demandé explicitement.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo Test
        run: cargo test

      - name: Cargo Clippy
        run: cargo clippy -- -D warnings

  check_style:
    runs-on: [self-hosted, linux, x64, minipc, podman]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cargo Format
        run: cargo fmt -- --check

      - name: Cargo Sort
        run: cargo install cargo-sort --debug && cargo-sort --check --workspace
